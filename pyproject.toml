[project]
name = "surgphase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "huggingface-hub>=0.14.1,<1.0",
    "librosa>=0.11.0",
    "matplotlib>=3.11.2",
    "numpy>=1.26.4",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "surgclip[hub]>=0.1.0",
    "surgmotion",
    "surgvlp>=0.1.1",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.extra-build-dependencies]
surgvlp = ["setuptools<81"]

[tool.uv.sources]
surgvlp = { git = "https://github.com/CAMMA-public/SurgVLP.git" }
surgmotion = { git = "https://github.com/sharifbubuka/SurgMotion.git", rev = "548b3a1f7e5859d4ecb20f4500e67f46238c94ea" }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
notebook = [
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]
